<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智麦 - 小麦生长智能诊断</title>
    
    <!-- 引入Bootstrap5 UI库 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入Bootstrap图标库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- 引入自定义全局样式 -->
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
<div class="layout-container">
    <!-- ========== 左侧导航栏 ========== -->
    <div class="sidebar">
        <div class="sidebar-logo">
            <i class="bi bi-flower1"></i>
            <span>智麦农业智能体</span>
        </div>
        <ul class="sidebar-menu">
            <li class="active">
                <i class="bi bi-cpu"></i>
                <a href=" ">智能诊断</a >
            </li>
            <li>
                <i class="bi bi-file-earmark-text"></i>
                <a href="history.html">历史案例</a >
            </li>
        </ul>
    </div>

    <!-- ========== 右侧主内容区 ========== -->
    <div class="main-wrapper">
        <!-- 顶部标题栏 -->
        <div class="page-header">
            <div class="page-title">小麦生长异常智能诊断</div>
            <span class="badge bg-success">MVP版本</span>
        </div>
        <!-- 页面主体：左右分栏 -->
        <div class="page-content">
            <div class="row g-3">
                <!-- 左栏：图片上传 + 视觉分析结果 -->
                <div class="col-5">
                    <!-- 上传卡片 -->
                    <div class="card">
                        <div class="card-title">
                            <i class="bi bi-cloud-upload"></i>
                            上传小麦图片
                        </div>
                        
                        <!-- 上传区域 点击/拖拽都支持 -->
                        <div class="upload-area" id="uploadArea">
                            <i class="bi bi-image" style="font-size: 48px; color: #999;"></i>
                            <p class="mt-2 mb-1">点击或拖拽图片到此处上传</p >
                            <p class="text-muted small">支持 JPG、PNG 格式，建议拍摄清晰叶片特写</p >
                            <input type="file" id="imageInput" accept="image/*">
                        </div>
                        <!-- 图片预览（默认隐藏） -->
                        <div id="previewBox" style="display: none;">
                            <div class="card-title mt-3">图片预览</div>
                            < img id="previewImg" class="preview-img" alt="上传预览图">
                        </div>
                    </div>
                    <!-- 视觉分析结果卡片（默认隐藏） -->
                    <div class="card" id="visionResultCard" style="display: none;">
                        <div class="card-title">
                            <i class="bi bi-eye"></i>
                            视觉模型分析结果
                        </div>
                        <table class="table table-bordered table-sm">
                            <tr>
                                <td width="100">作物类型</td>
                                <td id="res_crop">小麦</td>
                            </tr>
                            <tr>
                                <td>叶片颜色</td>
                                <td id="res_color">-</td>
                            </tr>
                            <tr>
                                <td>异常程度</td>
                                <td>
                                    <div class="progress" style="height: 10px;">
                                        <div id="res_level" class="progress-bar bg-warning" style="width: 0%"></div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>置信度</td>
                                <td>
                                    <div class="progress" style="height: 10px;">
                                        <div id="res_confidence" class="progress-bar bg-info" style="width: 0%"></div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>斑点情况</td>
                                <td id="res_spot">-</td>
                            </tr>
                            <tr>
                                <td>提取特征</td>
                                <td id="res_features">-</td>
                            </tr>
                        </table>
                    </div>
                </div>
                <!-- 右栏：Agent对话面板 -->
                <div class="col-7">
                    <div class="card h-100">
                        <div class="card-title">
                            <i class="bi bi-chat-dots"></i>
                            智能体交互
                        </div>
                        <div class="chat-panel">
                            <!-- 消息滚动区域 -->
                            <div class="chat-messages" id="chatMessages">
                                <div class="text-center text-muted my-5">
                                    <i class="bi bi-chat-square-text" style="font-size: 48px;"></i>
                                    <p class="mt-2">上传图片后，智能体将主动判断信息并与您交互</p >
                                </div>
                            </div
                            <!-- 底部输入框 -->
                            <div class="input-group">
                                <input type="text" id="chatInput" class="form-control" 
                                    placeholder="输入回答..." disabled>
                                <button class="btn btn-primary" id="sendBtn" disabled>
                                    发送
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 引入Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- 引入接口封装 -->
<script src="js/api.js"></script>
<script>
// ==================== 全局变量 ====================
let currentVisionResult = null; // 保存视觉分析结果
let currentCaseId = null;       // 当前诊断案例ID

// ==================== 1. 图片上传模块 ====================
const uploadArea = document.getElementById('uploadArea');
const imageInput = document.getElementById('imageInput');
const previewBox = document.getElementById('previewBox');
const previewImg = document.getElementById('previewImg');
const visionResultCard = document.getElementById('visionResultCard');

// 点击上传区域 → 触发文件选择
uploadArea.addEventListener('click', () => {
    imageInput.click();
});

// 支持拖拽上传
uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#409eff';
});
uploadArea.addEventListener('dragleave', () => {
    uploadArea.style.borderColor = '#d9d9d9';
});
uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#d9d9d9';
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
        handleImageUpload(file);
    }
});

// 选择文件后处理
imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleImageUpload(file);
});

/**
 * 处理图片上传 + 调用视觉接口
 * 答辩说明：这是前端核心流程：上传→预览→调接口→渲染结果→触发Agent对话
 */
async function handleImageUpload(file) {
    // 1. 显示预览图
    previewImg.src = URL.createObjectURL(file);
    previewBox.style.display = 'block';

    // 2. 清空上一次的对话和结果
    clearChat();
    visionResultCard.style.display = 'none';

    // 3. 显示加载提示
    addMessage('agent', '正在上传图片并调用视觉模型分析，请稍候...');

    try {
        // 4. 调用后端视觉接口
        const result = await uploadImage(file);
        currentVisionResult = result;

        // 5. 把视觉结果渲染到页面上
        renderVisionResult(result);

        // 6. 触发Agent首次对话（主动式交互的核心）
        addMessage('agent', '图片分析完成，正在综合判断信息是否充分...');
        
        const chatRes = await sendChat({
            vision_result: result,
            message: '已上传图片，请分析'
        });

        // 替换加载提示为Agent真实回复
        replaceLastMessage('agent', chatRes.reply);

        // 启用输入框，用户可以回答Agent的问题
        document.getElementById('chatInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;

        // 如果Agent判断信息足够，直接返回诊断结果
        if (chatRes.is_finished && chatRes.diagnosis) {
            addDiagnosisResult(chatRes.diagnosis);
            currentCaseId = chatRes.case_id;
        }

    } catch (error) {
        replaceLastMessage('agent', '图片分析失败，请检查后端服务是否启动');
        console.error(error);
    }
}

/**
 * 渲染视觉分析结果
 */
function renderVisionResult(data) {
    visionResultCard.style.display = 'block';
    document.getElementById('res_crop').textContent = data.crop_type || '小麦';
    document.getElementById('res_color').textContent = data.leaf_color || '-';
    document.getElementById('res_level').style.width = data.abnormal_level + '%';
    document.getElementById('res_confidence').style.width = Math.round(data.confidence * 100) + '%';
    document.getElementById('res_spot').textContent = data.has_spots ? data.spot_description : '无明显斑点';
    
    // 渲染特征标签
    const featuresHtml = data.features?.map(f => 
        `<span class="badge bg-light text-dark me-1">${f}</span>`
    ).join('') || '-';
    document.getElementById('res_features').innerHTML = featuresHtml;
}

// ==================== 2. 对话交互模块 ====================
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

// 点击发送按钮
sendBtn.addEventListener('click', sendUserMessage);
// 回车发送
chatInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') sendUserMessage();
});

/**
 * 发送用户消息
 */
async function sendUserMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    // 添加用户消息到聊天框
    addMessage('user', text);
    chatInput.value = '';

    // 添加Agent加载提示
    addMessage('agent', '思考中...');
    chatInput.disabled = true;
    sendBtn.disabled = true;

    try {
        const res = await sendChat({
            case_id: currentCaseId,
            message: text
        });

        // 替换加载提示为真实回复
        replaceLastMessage('agent', res.reply);

        // 诊断完成则显示结果卡片
        if (res.is_finished && res.diagnosis) {
            addDiagnosisResult(res.diagnosis);
            currentCaseId = res.case_id;
        }

    } catch (error) {
        replaceLastMessage('agent', '请求失败，请重试');
    } finally {
        chatInput.disabled = false;
        sendBtn.disabled = false;
        chatInput.focus();
    }
}

/**
 * 向聊天框添加一条消息
 */
function addMessage(role, content) {
    const div = document.createElement('div');
    div.className = `message-item ${role}`;
    
    const icon = role === 'agent' ? 'bi-cpu' : 'bi-person';
    div.innerHTML = `
        <div class="message-avatar">
            <i class="bi ${icon}"></i>
        </div>
        <div class="message-bubble">${content}</div>
    `;
    
    chatMessages.appendChild(div);
    // 自动滚动到底部
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

/**
 * 替换最后一条消息（用于替换加载提示）
 */
function replaceLastMessage(role, content) {
    const lastMsg = chatMessages.lastElementChild;
    if (lastMsg) {
        lastMsg.querySelector('.message-bubble').innerHTML = content;
    }
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

/**
 * 添加诊断结果高亮卡片
 */
function addDiagnosisResult(diagnosis) {
    const html = `
        <div class="diagnosis-result">
            <h5><i class="bi bi-exclamation-triangle"></i> 诊断结论与管理建议</h5>
            <p><strong>可能原因：</strong>${diagnosis.possible_causes?.join('、') || '暂无'}</p >
            <p><strong>风险提示：</strong>${diagnosis.risk_tip || '暂无'}</p >
            <p><strong>管理建议：</strong></p >
            <ul>
                ${diagnosis.suggestions?.map(s => `<li>${s}</li>`).join('') || ''}
            </ul>
            <p><strong>进一步检查：</strong>${diagnosis.next_step || '暂无'}</p >
        </div>
    `;
    addMessage('agent', html);
}

/**
 * 清空聊天记录
 */
function clearChat() {
    chatMessages.innerHTML = `
        <div class="text-center text-muted my-5">
            <i class="bi bi-chat-square-text" style="font-size: 48px;"></i>
            <p class="mt-2">上传图片后，智能体将主动判断信息并与您交互</p >
        </div>
    `;
    document.getElementById('chatInput').disabled = true;
    document.getElementById('sendBtn').disabled = true;
}
</script>
</body>
</html>
