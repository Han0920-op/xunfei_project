<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智麦 - 小麦生长智能诊断</title>
    
    <!-- 引入Bootstrap5 UI库 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入Bootstrap图标库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- 引入自定义全局样式 -->
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
<div class="layout-container">
    <!-- ========== 左侧导航栏 ========== -->
    <div class="sidebar">
        <div class="sidebar-logo">
            <i class="bi bi-flower1"></i>
            <span>智麦农业智能体</span>
        </div>
        <ul class="sidebar-menu">
            <li class="active">
                <i class="bi bi-cpu"></i>
                <a href="index.html">智能诊断</a >
            </li>
            <li>
                <i class="bi bi-file-earmark-text"></i>
                <a href="history.html">历史案例</a >
            </li>
        </ul>
    </div>

    <!-- ========== 右侧主内容区 ========== -->
    <div class="main-wrapper">
        <!-- 顶部标题栏 -->
        <div class="page-header">
            <div class="page-title">小麦生长异常智能诊断</div>
            <span class="badge bg-success">MVP版本</span>
        </div>
        <!-- 复查模式横幅（从历史案例进入时显示） -->
        <div id="recheckBanner" class="alert alert-info mb-3" style="display:none;"></div>
        <!-- 页面主体：左右分栏 -->
        <div class="page-content">
            <div class="row g-3">
                <!-- 左栏：图片上传 + 视觉分析结果 -->
                <div class="col-5">
                    <!-- 上传卡片 -->
                    <div class="card">
                        <div class="card-title">
                            <i class="bi bi-cloud-upload"></i>
                            上传小麦图片
                        </div>
                        
                        <!-- 上传区域 点击/拖拽都支持 -->
                        <div class="upload-area" id="uploadArea">
                            <i class="bi bi-image" style="font-size: 48px; color: #999;"></i>
                            <p class="mt-2 mb-1">点击或拖拽图片到此处上传</p >
                            <p class="text-muted small">支持 JPG、PNG 格式，建议拍摄清晰叶片特写</p >
                            <input type="file" id="imageInput" accept="image/*">
                        </div>
                        <!-- 图片预览（默认隐藏） -->
                        <div id="previewBox" style="display: none;">
                            <div class="card-title mt-3">图片预览</div>
                            <img id="previewImg" class="preview-img" alt="上传预览图">
                        </div>
                    </div>
                    <!-- 视觉分析结果卡片（默认隐藏） -->
                    <div class="card" id="visionResultCard" style="display: none;">
                        <div class="card-title">
                            <i class="bi bi-eye"></i>
                            视觉模型分析结果
                        </div>
                        <div id="visionResultText" class="vision-result-text">-</div>
                    </div>
                </div>
                <!-- 右栏：Agent对话面板 -->
                <div class="col-7">
                    <div class="card h-100">
                        <div class="card-title">
                            <i class="bi bi-chat-dots"></i>
                            智能体交互
                        </div>
                        <div class="chat-panel">
                            <!-- 消息滚动区域 -->
                            <div class="chat-messages" id="chatMessages">
                                <div class="text-center text-muted my-5">
                                    <i class="bi bi-chat-square-text" style="font-size: 48px;"></i>
                                    <p class="mt-2">上传图片后自动识别，输入问题即可开始对话</p >
                                </div>
                            </div>
                            <!-- 底部输入框 -->
                            <div class="input-group">
                                <input type="text" id="chatInput" class="form-control" 
                                    placeholder="输入消息...">
                                <button class="btn btn-primary" id="sendBtn">
                                    发送
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 引入Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- 引入接口封装 -->
<script src="js/api.js"></script>
<script>
// ==================== 全局变量 ====================
let currentVisionResult = null; // 保存视觉分析结果
let currentImagePath = null;    // 本次图片在服务器上的路径（复查时关联用）
let currentCaseId = null;       // 当前诊断案例ID
let currentConversationId = null; // 当前对话会话ID
let recheckCaseId = null;       // 复查模式标记：从 URL 进入复查时非空

// ==================== 1. 图片上传模块 ====================
const uploadArea = document.getElementById('uploadArea');
const imageInput = document.getElementById('imageInput');
const previewBox = document.getElementById('previewBox');
const previewImg = document.getElementById('previewImg');
const visionResultCard = document.getElementById('visionResultCard');

// 点击上传区域 → 触发文件选择
uploadArea.addEventListener('click', () => {
    imageInput.click();
});

// 支持拖拽上传
uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#409eff';
});
uploadArea.addEventListener('dragleave', () => {
    uploadArea.style.borderColor = '#d9d9d9';
});
uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.style.borderColor = '#d9d9d9';
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
        handleImageUpload(file);
    }
});

// 选择文件后处理
imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) handleImageUpload(file);
});

/**
 * 处理图片上传 + 调用视觉接口
 * 只做「预览 + 识别」两步，不触发聊天；聊天由用户主动发送消息触发。
 */
async function handleImageUpload(file) {
    // 1. 显示预览图
    previewImg.src = URL.createObjectURL(file);
    previewBox.style.display = 'block';

    // 2. 清空上一次的识别结果；复查模式下保留原案例/会话，新案例模式才重置
    currentVisionResult = null;
    currentImagePath = null;
    if (!recheckCaseId) {
        currentCaseId = null;
        currentConversationId = null;
    }

    // 3. 显示识别中的提示
    const resultTextEl = document.getElementById('visionResultText');
    resultTextEl.textContent = '正在识别图片，请稍候...';
    visionResultCard.style.display = 'block';

    try {
        // 4. 调用后端视觉接口（复查模式会带上 case_id，避免新建案例）
        const res = await uploadImage(file, undefined, recheckCaseId);
        currentVisionResult = res.result || '';
        currentImagePath = res.image_path ?? null;
        if (!recheckCaseId) {
            currentCaseId = res.case_id ?? null;   // 新案例：记住本次图片对应的案例 ID
        }

        // 5. 渲染识别结果到页面
        renderVisionResult(currentVisionResult);
    } catch (error) {
        // 识别失败：显示错误，不自动聊天，不使用旧图片结果
        currentVisionResult = null;
        currentImagePath = null;
        resultTextEl.textContent = '图片识别失败，请重试或更换图片';
        console.error(error);
    }
}

/**
 * 渲染视觉分析结果：直接显示视觉模型返回的自然语言描述。
 */
function renderVisionResult(description) {
    visionResultCard.style.display = 'block';
    document.getElementById('visionResultText').textContent =
        description || '（未获取到图片描述）';
}

// ==================== 2. 对话交互模块 ====================
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

// 点击发送按钮
sendBtn.addEventListener('click', sendUserMessage);
// 回车发送
chatInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') sendUserMessage();
});

/**
 * 发送用户消息
 */
async function sendUserMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    // 添加用户消息到聊天框
    addMessage('user', text);
    chatInput.value = '';

    // 添加Agent加载提示
    addMessage('agent', '思考中...');
    chatInput.disabled = true;
    sendBtn.disabled = true;

    // 带上当前图片识别结果（若有），发送成功后清空，避免后续追问重复携带
    const visionResult = currentVisionResult;
    const imagePath = currentImagePath;

    try {
        const res = await sendChat({
            conversation_id: currentConversationId,
            message: text,
            vision_result: visionResult,
            case_id: currentCaseId,
            image_path: imagePath
        });
        currentConversationId = res.conversation_id;
        if (currentConversationId) {
            localStorage.setItem('lastConversationId', currentConversationId);
        }

        // 只有识别结果未被新图片替换时才清空，防止误清新图片的结果
        if (currentVisionResult === visionResult) {
            currentVisionResult = null;
        }
        if (currentImagePath === imagePath) {
            currentImagePath = null;
        }

        // 替换加载提示为真实回复
        replaceLastMessage('agent', res.reply);

        // 诊断完成则显示结果卡片
        if (res.is_finished && res.diagnosis) {
            addDiagnosisResult(res.diagnosis);
            currentCaseId = res.case_id;
        }

    } catch (error) {
        replaceLastMessage('agent', '请求失败，请重试');
    } finally {
        chatInput.disabled = false;
        sendBtn.disabled = false;
        chatInput.focus();
    }
}

/**
 * 向聊天框添加一条消息
 */
function addMessage(role, content) {
    const div = document.createElement('div');
    div.className = `message-item ${role}`;
    
    const icon = role === 'agent' ? 'bi-cpu' : 'bi-person';
    div.innerHTML = `
        <div class="message-avatar">
            <i class="bi ${icon}"></i>
        </div>
        <div class="message-bubble">${content}</div>
    `;
    
    chatMessages.appendChild(div);
    // 自动滚动到底部
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

/**
 * 替换最后一条消息（用于替换加载提示）
 */
function replaceLastMessage(role, content) {
    const lastMsg = chatMessages.lastElementChild;
    if (lastMsg) {
        lastMsg.querySelector('.message-bubble').innerHTML = content;
    }
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

/**
 * 添加诊断结果高亮卡片
 */
function addDiagnosisResult(diagnosis) {
    const html = `
        <div class="diagnosis-result">
            <h5><i class="bi bi-exclamation-triangle"></i> 诊断结论与管理建议</h5>
            <p><strong>可能原因：</strong>${diagnosis.possible_causes?.join('、') || '暂无'}</p >
            <p><strong>风险提示：</strong>${diagnosis.risk_tip || '暂无'}</p >
            <p><strong>管理建议：</strong></p >
            <ul>
                ${diagnosis.suggestions?.map(s => `<li>${s}</li>`).join('') || ''}
            </ul>
            <p><strong>进一步检查：</strong>${diagnosis.next_step || '暂无'}</p >
        </div>
    `;
    addMessage('agent', html);
}

// ==================== 3. 会话恢复与复查 ====================
/**
 * 按会话 ID 加载历史消息并渲染
 */
async function loadConversation(conversationId) {
    chatMessages.innerHTML = '<div class="text-center text-muted my-5"><div class="spinner-border"></div><p class="mt-2">加载历史消息中...</p></div>';
    try {
        const messages = await getConversationMessages(conversationId);
        chatMessages.innerHTML = '';
        if (!messages || messages.length === 0) {
            chatMessages.innerHTML = '<div class="text-center text-muted my-5">暂无历史消息</div>';
            return;
        }
        messages.forEach(m => addMessage(m.role, m.content));
    } catch (error) {
        chatMessages.innerHTML = '<div class="text-center text-danger my-5">加载历史消息失败，请检查后端服务</div>';
        console.error(error);
    }
}

/**
 * 加载复查案例上下文：显示横幅 + 恢复关联会话
 */
async function loadCaseContext(caseId) {
    const banner = document.getElementById('recheckBanner');
    try {
        const detail = await getCaseDetail(caseId);
        if (detail.conversation_id) {
            currentConversationId = detail.conversation_id;
            await loadConversation(detail.conversation_id);
            banner.className = 'alert alert-info mb-3';
            banner.style.display = 'block';
            banner.innerHTML = `<i class="bi bi-arrow-repeat"></i> 正在复查案例 #${detail.id}（${detail.create_time}）。<br><small>上次诊断：${detail.diagnosis || '暂无'}</small>`;
        } else {
            banner.className = 'alert alert-info mb-3';
            banner.style.display = 'block';
            banner.innerHTML = '<i class="bi bi-arrow-repeat"></i> 正在复查案例 #' + detail.id +
                '。该案例暂无历史聊天记录，可直接上传新图片开始跟踪。';
        }
    } catch (error) {
        banner.className = 'alert alert-danger mb-3';
        banner.style.display = 'block';
        banner.innerHTML = '加载案例失败，请检查后端服务。';
        console.error(error);
    }
}

// 页面加载：根据 URL 参数恢复会话 / 进入复查
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const caseIdParam = params.get('caseId');
    const conversationIdParam = params.get('conversationId');

    if (caseIdParam) {
        recheckCaseId = parseInt(caseIdParam, 10);
        currentCaseId = recheckCaseId;
    }
    if (conversationIdParam) {
        currentConversationId = parseInt(conversationIdParam, 10);
    }

    if (recheckCaseId) {
        loadCaseContext(recheckCaseId);
    } else if (currentConversationId) {
        loadConversation(currentConversationId);
    } else {
        const saved = localStorage.getItem('lastConversationId');
        if (saved) {
            currentConversationId = saved;
            loadConversation(saved);
        }
    }
};

</script>
</body>
</html>
